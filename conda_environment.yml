# Reproducible environment for the ML vs GNN pipeline.
#
#   conda env create -f conda_environment.yml        # run from the repository root
#   conda activate mlvsgnn_repro
#   python run_pipeline.py --check
#
# Conda provides Python (and pip); every scientific package is installed with pip from
# requirements.txt, which is the single place where versions are pinned.
# PyTDC needs a second step (pip install --no-deps PyTDC==0.4.1), done by setup_env.sh:
#   bash setup_env.sh        # creates the environment AND installs PyTDC correctly
# Python 3.11 (the paper runs used 3.11.16; scipy 1.16 requires >= 3.11).
name: mlvsgnn_repro
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      - -r requirements.txt
